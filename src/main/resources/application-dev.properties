# ===============================
# Development environment
# ===============================
# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/carportal_dev?ssl=false&options=-c%20TimeZone=UTC&currentSchema=car_portal
spring.datasource.username=dba_car_portal
spring.datasource.password=dba_password
# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=none   # convenient in dev
spring.jpa.show-sql=true               # show SQL in logs
# Logging (more verbose in dev)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
